plugins {
    id 'com.android.application'
}

android {
    namespace 'com.quotexsignals.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.quotexsignals.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "6.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            // signé avec la clé debug pour pouvoir installer directement l'APK
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
